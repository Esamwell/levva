# Configuração HTTP, sem TLS. É a que vale antes do certificado existir.
# Gerada em nginx.conf pelo instalar-vps.sh, com o domínio substituído.

server {
    listen 80;
    server_name SEU_DOMINIO_AQUI;

    # Por aqui o certbot prova que o domínio é seu. O arquivo vem do mesmo
    # volume (certbot_www) em que o container do certbot escreve.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M; # documentos do cadastro (limite de 10MB + folga)
    }
}
